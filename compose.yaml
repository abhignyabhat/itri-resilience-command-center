services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itri_app
      POSTGRES_PASSWORD: itri_local_dev
      POSTGRES_DB: itri_dev
    ports:
      - "5433:5432"
    volumes:
      - itri-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itri_app -d itri_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itri-postgres-data:
